[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bughunter"
version = "1.0.0"
description = "🐛 AI-powered security research assistant for bug bounty hunting — built on the BugHunter engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Bug Hunter Team" },
]
keywords = ["pentest", "security", "ai", "mcp", "cli", "vulnerability", "bug-bounty", "red-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "toml>=0.10.0",
    "jinja2>=3.1.0",
    "textual>=0.40.0",
    # ── Sandbox dependencies (python_execute runtime) ──────────────────
    # LLM can directly import these libraries in python_execute
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pycryptodome>=3.19.0",
    # ── Environment / dotenv ──
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "build>=1.2.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "docker>=7.0.0",
    "paramiko>=3.4.0",
]
kb = [
    "chromadb>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Unclecheng-li/BugHunter"
Documentation = "https://github.com/Unclecheng-li/BugHunter"

[project.scripts]
bughunter = "bughunter.cli.main:app"

[tool.hatch.build]
exclude = [
    "/frontend/node_modules",
    "/frontend/dist",
    "/.test-tmp",
    "/.pytest_cache",
    "/dist",
    "/build",
    "**/__pycache__",
    "**/*.pyc",
    "/_old_backup",
    "/_bughunter_src",
]

[tool.hatch.build.targets.wheel]
packages = ["bughunter"]

[tool.hatch.build.targets.sdist]
include = [
    "/bughunter",
    "/frontend",
    "/tests",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/frontend/node_modules",
    "/frontend/dist",
    "/.test-tmp",
    "/.pytest_cache",
    "/dist",
    "/build",
    "**/__pycache__",
    "**/*.pyc",
    "/_old_backup",
    "/_bughunter_src",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
